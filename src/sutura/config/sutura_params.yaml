/**:
  ros__parameters:
    grid_map:
      resolution_mm: 0.5
      width_cells: 200
      height_cells: 200
      default_frame_id: "camera_frame"

    pattern:
      type: "linear"              # Options: 'linear', 'mock'
      margin_mm: 3.0              # Distance from wound boundary to first/last stitch
      spacing_mm: 5.0             # Distance between consecutive stitches
      entry_offset_mm: 4.0        # Lateral offset from centerline for entry/exit
      default_entry_angle_deg: 90.0

    planner:
      type: "analytical"          # Options: 'analytical', 'moveit', 'mock'
      max_cartesian_step_mm: 1.0
      needle_radius_mm: 12.0

    arm:
      type: "mock"                # Options: 'ned1', 'mock', 'makiina'
      state_rate_hz: 10.0
      command_queue_size: 1       # Commands received while the queue is full are dropped
      can_interface: "can0"       # MAKIINA only
      ned1:
        ip_address: "169.254.200.200" # Ethernet (team setup): 169.254.200.200 | Hotspot: 10.10.10.10
        velocity_percent: 20      # 1-100, keep low for first real-world tests
        auto_calibrate: true
        safety_margin_rad: 0.02   # Margin from hardware limits (home pose j3=-1.30 sits 0.04 from -1.34)
        max_step_rad: 0.5         # Max joint displacement per command (<= 0 disables)
