[develop]
script_dir=$base/lib/sutura
[install]
install_scripts=$base/lib/sutura
[tool:pytest]
# colcon runs `python -m pytest` from the package source directory with no path argument.
# Pin the collection to test/ so that it matches `python3 -m pytest src/sutura/test`.
# -ra lists every skip with its reason in the colcon log.
testpaths = test
addopts = -ra
